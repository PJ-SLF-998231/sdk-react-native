# Dependabot: weekly version updates. Minor and patch bumps come grouped,
# one PR per ecosystem, to keep the noise down; majors come one by one.
# Security updates are separate and not limited by this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    # The shared self-hosted runner pool is capped; at most 3 open version-update
    # PRs per ecosystem keeps a Dependabot burst from queueing CI runs.
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    # Wait before proposing fresh releases (version updates only; security
    # updates ignore cooldown). Majors wait longer.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    # The shared self-hosted runner pool is capped; at most 3 open version-update
    # PRs per ecosystem keeps a Dependabot burst from queueing CI runs.
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    # Wait before proposing fresh releases (version updates only; security
    # updates ignore cooldown). Majors wait longer.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Production and dev dependencies are grouped separately; majors are
      # excluded from both and arrive one PR each, capped by the limit above.
      dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Expo SDK upgrades go through `npx expo install --fix`, which keeps
    # react, react-native and the expo packages on the versions one SDK
    # supports; a lone bump of one of them breaks the build.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
